name: Docs site

# Manual-dispatch workflows are only listed once GitHub has indexed the
# file on the default branch; if `gh workflow run` 404s, push a change to
# this file to force a re-index.

# Manual dispatch only. The site is published on demand, not on every push:
# doc content lands continuously, but a live-site rebuild is a deliberate act.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish to GitHub Pages (unchecked = build only)'
        type: boolean
        default: true

# GITHUB_TOKEN needs `pages: write` + `id-token: write` for the Pages
# deployment; everything else stays read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# One live site, so one deploy at a time. In-progress runs finish rather than
# being cancelled — a half-applied Pages deploy is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Keep in step with the `Hugo extended` floor in docs/README.md.
  HUGO_VERSION: 0.160.0
  HUGO_SHA256: 9f24f829c773d2ddc894cc0dbc70c380a769583f23f6d112841ee8e7fd6f837f

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not moving tags: a tag can be
      # repointed at new code without the workflow changing. The trailing
      # comment records what each SHA was when it was pinned.
      #
      # submodules: recursive — the hugo-book theme lives in
      # docs/themes/hugo-book as a submodule, and without it Hugo builds a
      # layout-less site that still exits 0. See the --panicOnWarning below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      # Hugo is fetched from the release tarball rather than apt (too old, not
      # extended) or a third-party action, and the checksum is verified: same
      # reasoning as pinning the actions above to SHAs.
      - name: Install Hugo ${{ env.HUGO_VERSION }} extended
        run: |
          set -euo pipefail
          tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${tarball}"
          echo "${HUGO_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" hugo
          sudo install -m 0755 hugo /usr/local/bin/hugo
          hugo version

      # Sets baseURL to the repo's real Pages URL, so the same config works
      # whether or not the site is served from a project sub-path.
      - name: Configure Pages
        if: inputs.deploy
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # --panicOnWarning turns Hugo's soft failures — a missing layout, an
      # unresolved ref — into a red build. A missing submodule is exactly the
      # class of breakage that otherwise ships a blank site.
      - name: Build site
        working-directory: docs
        # --baseURL is passed only when Configure Pages actually ran; an empty
        # override would otherwise rewrite every link to a bare path.
        run: |
          set -euo pipefail
          if [ -n "${PAGES_BASE_URL}" ]; then
            hugo --minify --panicOnWarning --baseURL "${PAGES_BASE_URL}"
          else
            hugo --minify --panicOnWarning
          fi
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload artifact
        if: inputs.deploy
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/public

  deploy:
    name: deploy
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
