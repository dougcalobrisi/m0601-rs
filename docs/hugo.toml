# Hugo config for the m0601 documentation site.
#
# Served at a GitHub Pages *project* sub-path, so baseURL carries /m0601-rs-test/.
# `hugo server` overrides baseURL locally, so previews work regardless.
baseURL = 'https://dougcalobrisi.github.io/m0601-rs-test/'
title = 'm0601 — RS485 hub motor driver'
theme = 'hugo-book'

# Book theme wants clean, non-ugly URLs.
disablePathToLower = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true            # allow raw HTML in Markdown (used sparingly)
  [markup.highlight]
    noClasses = false        # theme-driven syntax colors, light + dark
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  # 'auto' follows the reader's OS light/dark preference.
  BookTheme = 'auto'
  BookToC = true
  BookLogo = ''
  # "Edit this page" + repo links point at the real remote.
  BookRepo = 'https://github.com/dougcalobrisi/m0601-rs-test'
  BookEditPath = 'edit/main/docs/content'
  BookDateFormat = 'January 2, 2006'
  BookSearch = true
  BookComments = false
  # The library API reference (rustdoc) lands here once Pages is wired up.
  BookThemeColor = ''
